<div class="theme-toggle-container">
  <button id="theme-toggle" class="theme-toggle-btn" aria-label="Canvia mode clar/fosc" title="Canvia mode clar/fosc" type="button">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
</div>

<script>
  (function() {
    function initThemeToggle() {
      var btn = document.getElementById('theme-toggle');
      if (!btn || btn.dataset.initialized) return;
      btn.dataset.initialized = "true";

      btn.addEventListener('click', function() {
        var currentTheme = document.documentElement.getAttribute('data-theme') || 'default';
        var nextTheme = (currentTheme === 'dark') ? 'default' : 'dark';

        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('jtd-theme', nextTheme);

        if (typeof jtd !== 'undefined' && jtd.setTheme) {
          jtd.setTheme(nextTheme);
        } else {
          var links = document.querySelectorAll('link[rel="stylesheet"]');
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            if (href && href.indexOf('just-the-docs-') !== -1 && href.indexOf('head-nav') === -1) {
              links[i].setAttribute('href', '{{ "/assets/css/just-the-docs-" | relative_url }}' + nextTheme + '.css');
              break;
            }
          }
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initThemeToggle);
    } else {
      initThemeToggle();
    }
  })();
</script>
